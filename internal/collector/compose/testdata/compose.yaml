services:
  nginx:
    image: nginx
    ports: ["80:80", "127.0.0.1:443:443/tcp", "53:53/udp"]
    depends_on: [api]
  api:
    build: .
    ports:
      - target: 8080
        published: "8080"
    environment:
      DATABASE_URL: postgres://app:secret@localhost:5432/app
      REDIS_URL: redis://redis:6379
      WORKERS: 4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=secret
  redis:
    image: redis:7
