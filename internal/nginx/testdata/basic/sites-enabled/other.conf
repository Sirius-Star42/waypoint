server {
    listen 443 ssl;
    server_name *.example.com;
    location / { proxy_pass http://$upstream_host; }
}

server {
    listen 443 ssl;
    server_name www.example.*;
    location / { fastcgi_pass unix:/run/php/php8.2-fpm.sock; }
}

server {
    listen 443 ssl;
    server_name ~^(?<user>[a-z]+)\.users\.example\.org$;
    location / { proxy_pass http://127.0.0.1:7000; }
}

server {
    listen 443 ssl;
    server_name api.example.com;   # duplicate, ignored by nginx
    location / { proxy_pass http://127.0.0.1:1234; }
}

server {
    listen 8080;
    server_name static.local;
}
